[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "search-playground-api"
version = "0.1.0"
description = "Expandable API scaffold for Search Playground"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
